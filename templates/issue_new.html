{% extends "base.html" %}{% block content %}
<h2>Nová výdejka do zakázky</h2>
<form method="post"><label>Vyber zakázku</label><select name="order_number" required>{% for order in orders %}<option value="{{ order.order_number }}">{{ order.order_number }} - {{ order.name }}</option>{% endfor %}</select><button>Pokračovat</button></form>
{% if not orders %}<p>Zatím nejsou založené žádné zakázky.</p>{% endif %}
{% endblock %}
