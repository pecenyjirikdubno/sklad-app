{% extends "base.html" %}
{% block content %}
<section class="mobile-card">
    <h2>Pohyb materiálu</h2>
    <p><strong>{{ item.material_id }}</strong> — {{ item.name }}</p>
    <p>Aktuálně skladem: <strong>{{ item.quantity }} {{ item.unit }}</strong></p>
    <form method="post" class="card-form">
        <label>Typ pohybu
            <select name="movement_type" required>
                <option value="prijem">Naskladnit / příjem</option>
                <option value="vydej">Vyskladnit / výdej</option>
            </select>
        </label>
        <label>Měněné množství<input name="quantity" type="number" step="0.001" min="0.001" required></label>
        <label>Zakázka<input name="order_number" placeholder="např. ZAK-2026-001"></label>
        <label>Poznámka<input name="note"></label>
        <button type="submit">Uložit pohyb</button>
    </form>
</section>
{% endblock %}
